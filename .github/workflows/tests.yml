name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same pull request cancels the first. Three OS legs per run
# add up, and only the last commit's result is looked at anyway. Not on `main`:
# main is the release channel, every commit there is what somebody installs, and
# two merges in a row would leave the first one with no green run behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # The hook reads stdin unconditionally on its normal path, and two cases
    # invoke it with no stdin piped in, relying on the --path early exit. A
    # regression there should be a red X in ten minutes, not a six-hour job.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # On windows-latest, `shell: bash` is Git Bash, which is the interpreter
      # Claude Code picks for a command hook on native Windows. That makes this
      # leg the answer to "does it work under Git Bash".
      - name: Ensure jq
        shell: bash
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            case "$RUNNER_OS" in
              Linux)   sudo apt-get update && sudo apt-get install -y jq ;;
              macOS)   brew install jq ;;
              Windows) choco install jq -y ;;
            esac
          fi
          jq --version

      # One leg is enough: shellcheck reads the same files on all three. Warning
      # and up. The two info-level codes this repo trips are deliberate and would
      # be noise: SC2015 is the `... && ok || ko` of the test harness, where `ok`
      # cannot fail, and SC2016 is the literal ${CLAUDE_PLUGIN_ROOT} that
      # manifests.sh matches the hook command against.
      - name: ShellCheck
        if: runner.os == 'Linux'
        shell: bash
        run: |
          command -v shellcheck >/dev/null 2>&1 \
            || { sudo apt-get update && sudo apt-get install -y shellcheck; }
          shellcheck --version
          shellcheck -S warning hooks/*.sh demo/setup.sh tests/*.sh

      # Tracked text files only (-I skips demo.gif). The pattern is the UTF-8
      # bytes of U+2014, so this file does not match itself.
      - name: Prose
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if git grep -Il $'\xe2\x80\x94' -- .; then
            echo "U+2014 in the files above" >&2
            exit 1
          fi

      - name: Hook
        shell: bash
        run: bash tests/hook.sh

      - name: Manifests
        shell: bash
        run: bash tests/manifests.sh

      # demo/setup.sh is what the README's "Try it" section runs, and nothing
      # ran it. Install it into demo/homelab, then call the hook the way the
      # demo's own settings.json calls it, and check the handoff comes back.
      # Last, because it writes into the working tree.
      - name: Demo
        shell: bash
        run: |
          ./demo/setup.sh
          test -x demo/homelab/.claude/hooks/session-start-handoff.sh
          test -f demo/homelab/.claude/skills/persistent-handoff/SKILL.md
          payload=$(printf '{"session_id":"ci","cwd":"%s/demo/homelab","hook_event_name":"SessionStart","source":"startup"}' "$PWD")
          out=$(printf '%s' "$payload" \
            | PERSISTENT_HANDOFF_FILE="$PWD/demo/homelab/.claude/handoff.md" \
              demo/homelab/.claude/hooks/session-start-handoff.sh)
          printf '%s\n' "$out" | grep -q restic
